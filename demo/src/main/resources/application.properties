spring.application.name=demo

# SỬA THÀNH MYSQL
spring.datasource.url=jdbc:mysql://mysql:3306/DigitalLibrary?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=digitallibrary
spring.datasource.password=change_me_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration CHO MYSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Google Drive Configuration
google.drive.folder.id=1D9yGQ_xBZWe9ouRAiVYVbjC80XXFOjVO
google.drive.credentials.path=credentials.json

# Google OAuth 2.0 Configuration
# Get these from Google Cloud Console > APIs & Services > Credentials > OAuth 2.0 Client IDs
google.oauth2.client.id=${GOOGLE_OAUTH2_CLIENT_ID:}
google.oauth2.client.secret=${GOOGLE_OAUTH2_CLIENT_SECRET:}
google.oauth2.redirect.uri=${GOOGLE_OAUTH2_REDIRECT_URI:http://localhost:8080/oauth2/callback}

# Logging Configuration
# Logs are configured in logback-spring.xml
# All logs are written to files in the 'logs' directory, not to console
logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.com.example.demo.service.GoogleDriveService=INFO
logging.level.com.example.demo.service.CrawlerService=INFO
